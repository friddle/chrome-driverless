version: 49
jobs:
- name: build-images
  steps:
  - type: CheckoutStep
    name: checkout
    cloneCredential:
      type: DefaultCredential
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - type: CommandStep
    name: build-and-push
    runInContainer: false
    interpreter:
      type: PosixInterpreter
      shell: bash
      commands: |
        set -e
        export DOCKER_API_VERSION=1.43
        GIT_COMMIT=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date +%Y%m%d)
        REGISTRY="chrome-driverless"
        echo "commit=$GIT_COMMIT date=$BUILD_DATE registry=$REGISTRY"
        builder="default"

        # --- base image（系统依赖 + chromium）---
        docker buildx build --builder ${builder} -f Dockerfile.base \
          -t ${REGISTRY}-base:latest \
          -t ${REGISTRY}-base:${BUILD_DATE} \
          . --push

        # --- service image（FROM chrome-driverless-base:latest，缓存已在 dockerd）---
        docker buildx build --builder ${builder} -f Dockerfile \
          -t ${REGISTRY}:latest \
          -t ${REGISTRY}:${GIT_COMMIT} \
          -t ${REGISTRY}:${BUILD_DATE} \
          . --push

        echo "done: chrome-driverless -> ${REGISTRY}:latest (base: ${REGISTRY}-base:${BUILD_DATE})"
    runAs: 0:0
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  jobExecutor: developer-tools-bare
  triggers:
  - type: BranchUpdateTrigger
    branches: main
    userMatch: anyone
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 3600